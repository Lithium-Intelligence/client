name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - run: bun install --frozen-lockfile
      - run: bun run verify
      - run: bun test
      - run: bun run typecheck

  package-runners:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - run: bun install --frozen-lockfile
      - run: bun run package:pack
      - name: Prepare external consumer
        run: node -e "const fs=require('fs'); fs.mkdirSync('runner-smoke',{recursive:true}); fs.writeFileSync('runner-smoke/package.json', JSON.stringify({name:'lithium-client-runner-smoke',private:true,version:'0.0.0'}));"
      - name: Install packed Client with npm
        run: npm install ../dist/npm/lithium-client.tgz --no-audit --no-fund
        working-directory: runner-smoke
      - name: npx local package smoke
        run: npx --no-install lithium-client help
        working-directory: runner-smoke
      - name: bunx local package smoke
        run: bunx --no-install lithium-client help
        working-directory: runner-smoke
      - name: Linux package runtime smoke
        if: runner.os == 'Linux'
        run: npx --no-install lithium-client status
        working-directory: runner-smoke

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - run: bun install --frozen-lockfile
      - run: bun run build:windows
      - name: Windows native smoke
        run: .\dist\lithium-client-windows-x64.exe help

  build-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - run: bun install --frozen-lockfile
      - run: bun run build:linux
      - name: Linux native smoke
        run: ./dist/linux-x64/lithium-node status
        env:
          LITHIUM_NODE_CONFIG_FILE: deploy/linux-node/lithium-node.example.json
          LITHIUM_NODE_CREDENTIAL_FILE: .tmp-linux-node-credential
