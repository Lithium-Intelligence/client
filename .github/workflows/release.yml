name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - run: bun install --frozen-lockfile
      - run: bun run release:verify-tag
      - run: bun run verify
      - run: bun test
      - run: bun run typecheck
      - run: bun run build:windows
      - name: Windows native smoke
        run: .\dist\lithium-client-windows-x64.exe help
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/lithium-client-windows-x64.exe
          if-no-files-found: error

  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - run: bun install --frozen-lockfile
      - run: bun run release:verify-tag
      - run: bun run verify
      - run: bun test
      - run: bun run typecheck
      - run: bun run build:linux
      - name: Linux native smoke
        run: ./dist/linux-x64/lithium-node status
        env:
          LITHIUM_NODE_CONFIG_FILE: deploy/linux-node/lithium-node.example.json
          LITHIUM_NODE_CREDENTIAL_FILE: .tmp-linux-node-credential
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/lithium-client-linux-x64.tar.gz
          if-no-files-found: error

  publish:
    needs: [windows, linux]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - run: bun scripts/checksums.ts release-assets
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release-assets/lithium-client-windows-x64.exe
            release-assets/lithium-client-linux-x64.tar.gz
            release-assets/SHA256SUMS
